name: Temporary Neofetch Age Simulation

# 仅允许手动触发，不设置定时任务
on:
  workflow_dispatch:

# 只读权限，禁止修改仓库
permissions:
  contents: read

jobs:
  simulation:
    name: Test age rollover without changing published SVG
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Simulate birthday rollover
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import date, datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import os
          import sys
          import xml.etree.ElementTree as ET

          sys.path.insert(0, str(Path('generator').resolve()))

          import age_utils
          import update_age

          # 使用虚拟生日，不读取真实生日 Secret
          with patch.dict(os.environ, {'BIRTH_DATE': '2000-06-15'}):

              before = age_utils.calculate_age(
                  today=date(2027, 6, 14)
              )

              after = age_utils.calculate_age(
                  today=date(2027, 6, 15)
              )

              assert (before, after) == (26, 27)

              # 验证北京时间零点切换
              utc_before = datetime(
                  2027, 6, 14, 15, 59, 59,
                  tzinfo=timezone.utc
              )

              utc_midnight = datetime(
                  2027, 6, 14, 16, 0, 0,
                  tzinfo=timezone.utc
              )

              assert utc_before.astimezone(
                  age_utils.BEIJING_TZ
              ).date() == date(2027, 6, 14)

              assert utc_midnight.astimezone(
                  age_utils.BEIJING_TZ
              ).date() == date(2027, 6, 15)

              print("PASS: Beijing midnight age rollover")

              # 读取正式 SVG，但绝不修改
              published = Path('profile.svg')

              assert published.is_file()

              original_bytes = published.read_bytes()
              original_text = original_bytes.decode('utf-8')

              matches = list(
                  update_age.AGE_PATTERN.finditer(original_text)
              )

              assert len(matches) == 1

              match = matches[0]

              root = ET.fromstring(original_text)

              targets = [
                  element
                  for element in root.iter()
                  if element.get('id') == 'profile-age'
              ]

              assert len(targets) == 1

              # 临时目录：测试结束自动删除
              with TemporaryDirectory(
                  prefix='neofetch-age-test-'
              ) as temp_dir:

                  test_file = Path(temp_dir) / 'profile-test.svg'

                  # 模拟生日之前的年龄
                  fixture = (
                      original_text[:match.start(2)]
                      + '26 years'
                      + original_text[match.end(2):]
                  )

                  test_file.write_text(
                      fixture,
                      encoding='utf-8'
                  )

                  # 执行真实年龄更新函数
                  with patch.object(
                      update_age,
                      'calculate_age',
                      side_effect=lambda: age_utils.calculate_age(
                          today=date(2027, 6, 15)
                      )
                  ):

                      changed = update_age.update_age_only(
                          test_file
                      )

                      assert changed is True

                      result = test_file.read_text(
                          encoding='utf-8'
                      )

                      expected = (
                          fixture[:match.start(2)]
                          + '27 years'
                          + fixture[match.end(2):]
                      )

                      assert result == expected

                      ET.fromstring(result)

                      print("PASS: 26 years -> 27 years")
                      print("PASS: Other SVG content unchanged")

                      # 再次执行，验证不会重复修改
                      changed_again = update_age.update_age_only(
                          test_file
                      )

                      assert changed_again is False

                      assert test_file.read_text(
                          encoding='utf-8'
                      ) == result

                      print("PASS: No unnecessary update")

              # 验证正式文件完全没有变化
              assert published.read_bytes() == original_bytes

              print("PASS: Production SVG unchanged")
              print("PASS: Temporary files deleted")
              print("ALL TESTS PASSED")

          PY
