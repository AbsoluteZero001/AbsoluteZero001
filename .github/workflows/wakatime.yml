name: Update WakaTime Stats

on:
  schedule:
    # 每天 UTC 00:00 执行
    # 北京时间 08:00
    - cron: "0 0 * * *"

  # 支持 GitHub Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wakatime:
    runs-on: ubuntu-latest

    # 防止多个 README 更新任务同时修改仓库
    concurrency:
      group: readme-update
      cancel-in-progress: false

    steps:
      # ============================================================
      # Checkout Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # ① WakaTime All Time
      #
      # 从开始使用 WakaTime 至今
      # 只展示累计 Total Time
      # 不展示历史语言列表
      # ============================================================
      - name: Update WakaTime All Time Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          REPOSITORY: "AbsoluteZero001/AbsoluteZero001"

          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: true

          TIME_RANGE: "all_time"

          # 不展示历史语言列表
          # 只保留累计 Total Time
          LANG_COUNT: 0

          SECTION_NAME: "WakaTotal"

          COMMIT_MESSAGE: "chore: update WakaTime all-time stats"

      # ============================================================
      # 同步第一个 WakaTime Action 提交后的最新 README
      #
      # 第一个 waka-readme 会直接修改并提交 README
      # 第二个任务开始前重新同步 main
      # 避免两个 Section 更新时发生冲突
      # ============================================================
      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      # ============================================================
      # ② WakaTime Last 30 Days
      #
      # 只统计最近 30 天
      # 展示最近 30 天 Total Time
      # 展示最近 30 天语言 Top 10
      # ============================================================
      - name: Update WakaTime Last 30 Days Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          REPOSITORY: "AbsoluteZero001/AbsoluteZero001"

          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: true

          TIME_RANGE: "last_30_days"

          # 最近 30 天只展示使用时间最多的 10 项
          LANG_COUNT: 10

          SECTION_NAME: "WakaLast30Days"

          COMMIT_MESSAGE: "chore: update WakaTime 30-day stats"
