name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wakatime:
    runs-on: ubuntu-latest

    concurrency:
      group: readme-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update WakaTime All Time Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: "AbsoluteZero001/AbsoluteZero001"
          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: true
          TIME_RANGE: "all_time"
          LANG_COUNT: -1
          SECTION_NAME: "WakaTotal"
          COMMIT_MESSAGE: "chore: update WakaTime all-time stats"

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update WakaTime Last 30 Days Language Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: "AbsoluteZero001/AbsoluteZero001"
          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: false
          TIME_RANGE: "last_30_days"
          LANG_COUNT: 10
          SECTION_NAME: "WakaLast30Days"
          COMMIT_MESSAGE: "chore: update WakaTime 30-day stats"
