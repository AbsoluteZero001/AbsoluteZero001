name: Build Neofetch Profile Card

# ============================================================
# 自动触发
# ============================================================

on:
  # 每天北京时间 08:00
  # GitHub Actions 默认使用 UTC
  schedule:
    - cron: '0 0 * * *'

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:


# ============================================================
# 权限
# ============================================================

# 允许 GitHub Actions 将 profile.svg 提交回仓库
permissions:
  contents: write


# ============================================================
# 并发控制
# ============================================================

# 避免同一工作流重复运行导致提交冲突
concurrency:
  group: neofetch-profile-card
  cancel-in-progress: false


# ============================================================
# 生成任务
# ============================================================

jobs:
  build-profile:

    name: Generate and Update Profile SVG

    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------
      # 1. 拉取仓库代码
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true


      # ------------------------------------------------------
      # 2. 配置 Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip


      # ------------------------------------------------------
      # 3. 安装 Python 依赖
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # 4. 下载 GitHub 头像
      # ------------------------------------------------------

      - name: Download GitHub avatar
        run: |
          python generator/avatar.py


      # ------------------------------------------------------
      # 5. 生成 ASCII Art 猫咪
      # ------------------------------------------------------

      - name: Generate ASCII avatar
        run: |
          python generator/ascii_art.py


      # ------------------------------------------------------
      # 6. 生成 Neofetch SVG
      # ------------------------------------------------------

      - name: Generate Neofetch profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
        run: |
          python generator/profile_card.py


      # ------------------------------------------------------
      # 7. 验证 SVG
      # ------------------------------------------------------

      - name: Validate SVG
        run: |
          test -s cache/profile.svg

          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "cache/profile.svg"

          tree = ET.parse(path)
          root = tree.getroot()

          if not root.tag.endswith("svg"):
              raise RuntimeError("Generated file is not an SVG")

          print("SVG validation successful")
          print("Width:", root.attrib.get("width"))
          print("Height:", root.attrib.get("height"))
          PY


      # ------------------------------------------------------
      # 8. 复制 SVG 到仓库根目录
      # ------------------------------------------------------

      - name: Publish SVG
        run: |
          cp cache/profile.svg profile.svg


      # ------------------------------------------------------
      # 9. 配置 Git 提交身份
      # ------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ------------------------------------------------------
      # 10. 自动提交并推送 SVG（自动处理并发更新）
      # ------------------------------------------------------

      - name: Commit and push profile.svg
        shell: bash
        run: |
          set -euo pipefail

          # 保存本次生成的 SVG，避免同步分支时丢失
          cp profile.svg /tmp/neofetch-profile.svg

          # 最多重试 5 次
          for attempt in 1 2 3 4 5; do

            echo "================================"
            echo "Push attempt: $attempt"
            echo "================================"

            # 获取远程最新 main
            git fetch origin main

            # 将当前工作区同步到远程最新 main
            git reset --hard origin/main

            # 恢复本次生成的 SVG
            cp /tmp/neofetch-profile.svg profile.svg

            # 添加生成文件
            git add -f profile.svg

            # 检查是否有变化
            if git diff --cached --quiet; then
              echo "profile.svg is already up to date."
              exit 0
            fi

            # 创建提交
            git commit -m "chore: update Neofetch profile card"

            # 尝试推送
            if git push origin HEAD:main; then
              echo "profile.svg updated successfully."
              exit 0
            fi

            echo "Remote branch changed. Retrying..."
            sleep 5

          done

          echo "Failed to push after 5 attempts."
          exit 1
