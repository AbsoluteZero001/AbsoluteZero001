name: Build Neofetch Profile Card

# ============================================================
# 自动触发
# ============================================================

on:
  # 每天北京时间 08:00
  # GitHub Actions 默认使用 UTC
  schedule:
    - cron: '0 0 * * *'

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:


# ============================================================
# 权限
# ============================================================

# 允许 GitHub Actions 将 profile.svg 提交回仓库
permissions:
  contents: write


# ============================================================
# 并发控制
# ============================================================

# 避免同一工作流重复运行导致提交冲突
concurrency:
  group: neofetch-profile-card
  cancel-in-progress: false


# ============================================================
# 生成任务
# ============================================================

jobs:
  build-profile:

    name: Generate and Update Profile SVG

    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------
      # 1. 拉取仓库代码
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true


      # ------------------------------------------------------
      # 2. 配置 Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip


      # ------------------------------------------------------
      # 3. 安装 Python 依赖
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # 4. 下载 GitHub 头像
      # ------------------------------------------------------

      - name: Download GitHub avatar
        run: |
          python generator/avatar.py


      # ------------------------------------------------------
      # 5. 生成 ASCII Art 猫咪
      # ------------------------------------------------------

      - name: Generate ASCII avatar
        run: |
          python generator/ascii_art.py


      # ------------------------------------------------------
      # 6. 生成 Neofetch SVG
      # ------------------------------------------------------

      - name: Generate Neofetch profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generator/profile_card.py


      # ------------------------------------------------------
      # 7. 验证 SVG
      # ------------------------------------------------------

      - name: Validate SVG
        run: |
          test -s cache/profile.svg

          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "cache/profile.svg"

          tree = ET.parse(path)
          root = tree.getroot()

          if not root.tag.endswith("svg"):
              raise RuntimeError("Generated file is not an SVG")

          print("SVG validation successful")
          print("Width:", root.attrib.get("width"))
          print("Height:", root.attrib.get("height"))
          PY


      # ------------------------------------------------------
      # 8. 复制 SVG 到仓库根目录
      # ------------------------------------------------------

      - name: Publish SVG
        run: |
          cp cache/profile.svg profile.svg


      # ------------------------------------------------------
      # 9. 配置 Git 提交身份
      # ------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ------------------------------------------------------
      # 10. 自动提交并推送 SVG
      # ------------------------------------------------------

      - name: Commit and push profile.svg
        run: |
          git add -f profile.svg

          if git diff --cached --quiet; then
            echo "profile.svg has not changed."
            echo "No commit required."
          else
            git commit -m "chore: update Neofetch profile card"
            git push
            echo "profile.svg updated successfully."
          fi
