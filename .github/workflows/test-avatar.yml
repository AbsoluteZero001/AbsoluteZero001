name: Test Neofetch Profile Card

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-avatar:
    name: Generate Neofetch Profile
    runs-on: ubuntu-24.04

    steps:
      # 1. 拉取 GitHub 仓库
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. 配置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. 安装 Python 依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. 下载 GitHub 头像
      - name: Download GitHub Avatar
        run: python generator/avatar.py

      # 5. 将头像转换为彩色 ASCII 字符画
      - name: Generate ASCII Avatar
        run: python generator/ascii_art.py

      # 6. 生成完整 Neofetch 终端卡片
      - name: Generate Neofetch Profile
        run: python generator/profile_card.py

      # 7. 验证所有生成文件
      - name: Verify Generated Files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path("cache/avatar.png"),
              Path("cache/avatar.svg"),
              Path("cache/profile.svg"),
          ]

          for file in files:
              if not file.is_file():
                  raise FileNotFoundError(
                      f"Required file not found: {file}"
                  )

              if file.stat().st_size == 0:
                  raise ValueError(
                      f"Generated file is empty: {file}"
                  )

              print(
                  f"PASS: {file} "
                  f"({file.stat().st_size:,} bytes)"
              )

          # 验证头像 SVG
          ET.parse("cache/avatar.svg")
          print("PASS: Avatar SVG XML valid")

          # 验证 Neofetch SVG
          ET.parse("cache/profile.svg")
          print("PASS: Profile SVG XML valid")

          print("All validation checks passed!")
          PY

      # 8. 上传全部预览文件
      - name: Upload Neofetch Preview
        uses: actions/upload-artifact@v7
        with:
          name: neofetch-profile-preview
          path: |
            cache/avatar.png
            cache/avatar.svg
            cache/profile.svg
          if-no-files-found: error
          retention-days: 7
